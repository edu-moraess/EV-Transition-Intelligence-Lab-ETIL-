# .streamlit/secrets.toml
# ─────────────────────────────────────────────────────────────────────────────
# ETIL — API Keys Configuration
#
# HOW TO USE:
#   Local development : place this file at .streamlit/secrets.toml
#   Streamlit Cloud   : go to App Settings → Secrets → paste the contents below
#
# NEVER commit this file to GitHub. It is already in .gitignore.
# ─────────────────────────────────────────────────────────────────────────────


# ── NewsAPI ───────────────────────────────────────────────────────────────────
# Powers the EV Pulse page (live news + AI summaries).
# Free tier: 100 requests/day · 1,000 requests/month
# Get your key at: https://newsapi.org/register
#
NEWSAPI_KEY = "your_newsapi_key_here"


# ── Anthropic API ─────────────────────────────────────────────────────────────
# Powers the AI summaries in EV Pulse via claude-sonnet-4-6.
# The key is injected automatically by Streamlit Cloud when using
# the built-in Claude integration (no key needed in that case).
# For local development, add your key here:
# Get your key at: https://console.anthropic.com/
#
# ANTHROPIC_API_KEY = "your_anthropic_api_key_here"


# ── Optional: World Bank API ──────────────────────────────────────────────────
# Required for the Country Fundamentals feature (ETIL 2.0+).
# The World Bank API is public and requires no key for basic usage.
# Only needed if you hit rate limits:
#
# WORLD_BANK_API_KEY = ""


# ─────────────────────────────────────────────────────────────────────────────
# SETUP CHECKLIST
#
# 1. Copy this file to .streamlit/secrets.toml
# 2. Replace "your_newsapi_key_here" with your actual NewsAPI key
# 3. For local dev with Claude summaries, uncomment ANTHROPIC_API_KEY
# 4. On Streamlit Cloud: App Settings → Secrets → paste contents
# 5. Restart the app
# ─────────────────────────────────────────────────────────────────────────────
